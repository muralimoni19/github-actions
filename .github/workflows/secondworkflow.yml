name: cowsay thirdpart plugin

on: push 

jobs: 
    first_jobs:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout 
          uses: actions/checkout@v7 
        - name: welcome message
          run: |
            echo "my first github actions job"
            ls
            cat README.md
        - name: Install cowsay
          run: |
            sudo apt-get update
            sudo apt-get install -y cowsay

        - name: Run cowsay
          run: /usr/games/cowsay "Hello from GitHub Actions - Murali"